name: Bug report
description: Report something that is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: update to the latest `main` (`git pull`), rebuild
        (`npm run build`), and re-test. If the diagnostics panel can reproduce
        the problem, its output is the single most useful thing you can attach.

        For security vulnerabilities, do **not** use this template — follow
        [SECURITY.md](../../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what actually happened.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options:
        - Local Mode (Ollama)
        - Online Mode (Gemini Live)
        - Both
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: "SERA version (Settings or /api/health), Node.js version (`node --version`), OS version."
      placeholder: "SERA 1.6.10, Node 22.14.0, Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: Header → shield icon → Run full scan, then paste the relevant failures.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant server logs
      description: Output of the "SERA Server" console window, trimmed to the error region.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I updated to the latest `main` and re-tested
        - label: I searched existing issues for a duplicate
