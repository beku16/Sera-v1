name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what stands in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you want to happen. Concrete behavior beats vague wishes.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing settings you tried.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked that this is not already possible with current settings or commands
