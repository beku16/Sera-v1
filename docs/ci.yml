name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Node 20 reached end-of-life in April 2026, and the test toolchain has
      # moved past it: jsdom 30 (vitest jsdom environment) requires
      # ^22.22.2 || ^24.15.0 || >=26 — its undici 8 dependency uses
      # worker_threads.markAsUncloneable, which Node 20 lacks. Test the two
      # supported LTS lines instead.
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # robotjs / playwright / electron ship platform-specific native bits;
      # the unit suite never needs them (Windows-gated tests skip themselves,
      # real-Chromium tests in browser.test.ts skip when the bundled browser
      # is absent, and the browser E2E is opt-in via BROWSER_E2E_TEST=1).
      # --ignore-scripts keeps CI green on Linux while still type-checking
      # and testing every platform-independent line.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint (tsc --noEmit)
        run: npm run lint

      # A vitest forks worker very rarely dies on a hosted runner
      # ("Worker exited unexpectedly", no stack — transient and
      # environmental; the identical suite passes on the adjacent commit).
      # Give the suite exactly ONE automatic retry: deterministic failures
      # fail both attempts and stay red, so nothing gets masked.
      - name: Test (vitest, attempt 1)
        id: test1
        continue-on-error: true
        run: npm test

      - name: Test (vitest, retry once on transient failure)
        if: steps.test1.outcome == 'failure'
        run: npm test

  build:
    name: Production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build server bundle + frontend
        run: npm run build
        env:
          # The bundle step embeds no secrets; keys are resolved at runtime.
          GEMINI_API_KEY: ''
